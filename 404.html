<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | Página No Encontrada</title>
    
    <!-- Directiva para buscadores (Evita indexar la página de error) -->
    <meta name="robots" content="noindex, follow">

    <!-- Favicons & Manifest -->
    <link rel="icon" type="image/svg+xml" href="https://portafolio-xt6g.onrender.com/Imagenes/favicon.svg" />
    <link rel="icon" type="image/png" sizes="180x180" href="https://portafolio-xt6g.onrender.com/Imagenes/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="https://portafolio-xt6g.onrender.com/Imagenes/favicon.png" />
    <link rel="manifest" href="/manifest.json">

    <!-- Hojas de estilo (Rutas absolutas desde raíz) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/CSS/styles.css">
    <link rel="stylesheet" href="/CSS/404.css">
</head>
<body>

    <!-- Header minimalista -->
    <header class="navbar">
        <div class="logo">
            <a href="/index.html" style="text-decoration: none; color: inherit;"><span>&lt;RC /&gt;</span></a>
        </div>
        <nav>
            <a href="/index.html" class="btn btn-outline"><i class="fas fa-home"></i> Inicio</a>
        </nav>
    </header>

    <!-- Contenido principal 404 -->
    <main class="error-container">
        <div class="error-content">
            <div class="error-code">4<span class="pulse-icon"><i class="fas fa-bug"></i></span>4</div>
            <h1 class="error-title">¡Ups! Ruta no encontrada</h1>
            <p class="error-description">
                Parece que te has desviado del parámetro correcto o la página que buscas fue movida de directorio.
            </p>
            
            <div class="error-actions">
                <a href="/index.html" class="btn btn-outline"><i class="fas fa-arrow-left"></i> Volver al Inicio</a>
                <a href="/index.html#projects" class="btn btn-outline"><i class="fas fa-folder-open"></i> Ver Proyectos</a>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Richard Cespedes. Guarenas, Miranda, Venezuela.</p>
    </footer>

</body>
</html>
